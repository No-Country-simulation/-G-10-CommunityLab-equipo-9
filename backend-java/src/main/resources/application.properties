spring.application.name=backend-java
server.port=${PORT:8080}

# Importación de variables de entorno
spring.config.import=optional:file:.env[.properties]

# Configuración OCI (Oracle Cloud Infrastructure)
# Vacía por defecto: sin ella la aplicación igual arranca (solo falla la subida a OCI)
oci.par.url=${OCI_PAR_URL:}

# API keys por cliente (S1): cabecera X-Api-Key. Se generan con scripts/generar_api_key.py.
# Sin ninguna clave, la API rechaza todo salvo /actuator/health. Después se suman bot y panel.
seguridad.api-keys.ingesta=${API_KEY_INGESTA:}

# Tope del cuerpo de cada pedido (5 MB). Un lote de 1000 mensajes pesa unos 1,5 MB
seguridad.max-bytes-cuerpo=5242880

# Conexión a PostgreSQL enlazada al .env
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tu_base_local}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Las tablas las crea Flyway (src/main/resources/db/migration); Hibernate solo comprueba que coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect // suprecion del WARNNING

# Integración con Docker Compose
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

# URL del microservicio Python NLP (Usa localhost para pruebas con 'Run' y el nombre del contenedor o servicio para Docker)
python.nlp.service.url=${PYTHON_NLP_URL:http://localhost:8000}