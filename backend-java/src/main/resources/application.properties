spring.application.name=backend-java
server.port=${PORT:8080}

# Importación de variables de entorno
spring.config.import=optional:file:.env[.properties]

# Configuración OCI (Oracle Cloud Infrastructure)
# Vacía por defecto: sin ella la aplicación igual arranca (solo falla la subida a OCI)
oci.par.url=${OCI_PAR_URL:}

# API keys por cliente (S1): cabecera X-Api-Key. Se generan con scripts/generar_api_key.py.
# Sin ninguna clave, la API rechaza todo salvo /actuator/health.
# Cada clave abre solo su puerta (DEC-70): ingesta → /api/v1/lotes, bot → /api/v1/mensajes/en-vivo,
# panel → /api/v1/borradores/**, /api/v1/errores/** (T07) y /api/v1/dashboard/** (T08)
seguridad.api-keys.ingesta=${API_KEY_INGESTA:}
seguridad.api-keys.bot=${API_KEY_BOT:}
seguridad.api-keys.panel=${API_KEY_PANEL:}

# Tope del cuerpo de cada pedido (5 MB). Un lote de 1000 mensajes pesa unos 1,5 MB
seguridad.max-bytes-cuerpo=5242880

# Clave que Java envía a la IA en X-Api-Key (S2). La genera scripts/generar_api_key.py --cliente ia
ia.api-key=${API_KEY_IA:}

# Clasificación en segundo plano de los mensajes PENDIENTE (T04)
clasificacion.habilitada=${CLASIFICACION_HABILITADA:true}
clasificacion.intervalo-ms=30000
clasificacion.retraso-inicial-ms=20000
clasificacion.tanda=5
clasificacion.max-intentos=3
clasificacion.reserva-segundos=120

# Generación de borradores del Agente-Mod (T06): post de LinkedIn y caso de éxito de cada logro
generacion.habilitada=${GENERACION_HABILITADA:true}
generacion.intervalo-ms=60000
generacion.retraso-inicial-ms=45000
generacion.tanda=3
generacion.max-intentos=3
generacion.reserva-segundos=180
generacion.max-respuestas=20

# FAQ semanal (T06b): las dudas repetidas de la semana se convierten en un borrador FAQ (POST /v1/faq de la IA)
faq.habilitada=${FAQ_SEMANAL_HABILITADA:true}
# Una vez por semana: segundo minuto hora día-del-mes mes día-de-la-semana (lunes a las 8:00). "-" la apaga
faq.cron=${FAQ_SEMANAL_CRON:0 0 8 * * MON}
faq.zona=${FAQ_SEMANAL_ZONA:America/Bogota}
# true: corre una vez al encender Java (para la demo), 90 s después, cuando la IA ya cargó el Agente FAQ
faq.al-arrancar=${FAQ_SEMANAL_AL_ARRANCAR:false}
faq.retraso-arranque-ms=90000
# Cuántos días hacia atrás se juntan las dudas
faq.dias=${FAQ_SEMANAL_DIAS:7}
# Si falla, se reintenta cada 30 minutos con la misma ventana; al tercer fallo, ERROR
faq.reintento-ms=1800000
faq.max-intentos=3
faq.reserva-segundos=300
faq.max-dudas=200
# La IA tiene un tope de 120 s (FAQ_SEMANAL_TOPE_S): Java la espera más
faq.tiempo-lectura-s=150

# Dashboard (T08): los días y las semanas se cuentan en esta zona horaria (las semanas empiezan el lunes)
dashboard.zona=${DASHBOARD_ZONA:America/Bogota}

# Hilos de las tareas programadas: la FAQ puede tardar 2 minutos y no tiene que frenar la clasificación
# ni la generación (con 1 hilo, que es lo que trae Spring, esperarían a que termine)
spring.task.scheduling.pool.size=3

# Conexión a PostgreSQL enlazada al .env
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tu_base_local}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Las tablas las crea Flyway (src/main/resources/db/migration); Hibernate solo comprueba que coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect // suprecion del WARNNING

# Integración con Docker Compose
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

# URL del microservicio Python NLP (Usa localhost para pruebas con 'Run' y el nombre del contenedor o servicio para Docker)
python.nlp.service.url=${PYTHON_NLP_URL:http://localhost:8000}