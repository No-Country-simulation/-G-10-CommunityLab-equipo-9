spring.application.name=backend-java
server.port=${PORT:8080}

# Importación de variables de entorno
spring.config.import=optional:file:.env[.properties]

# Configuración OCI (Oracle Cloud Infrastructure)
oci.par.url=${OCI_PAR_URL:https://objectstorage.sa-bogota-1.oraclecloud.com/p/RDUhZAw0t_PRpLvch7JJ1N8U5YL-pi_-Wc8VeTxXZkNJdaGay_bwjMbzyjI9j92Z/n/axmccr00xq51/b/dato/o/}

# Conexión a PostgreSQL enlazada al .env
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Configuración de JPA / Hibernate para PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect // suprecion del WARNNING

# Integración con Docker Compose
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}